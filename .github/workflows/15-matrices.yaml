name: 15-matrices

on:
    workflow_dispatch

jobs:
    backward_compatibility:
        strategy:
            matrix:
                python-version: [3.14, 3.15, 3.16]
                os: [ubuntu-latest, windows-latest]
      
        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup python 
              uses: actions/setup-python@v6
              with: 
                python-version: ${{ matrix.python-version }}

            - name: python version & os 
        
              run: |
                python --version
                echo "OS: ${{ matrix.os }}"  
                
      
            




