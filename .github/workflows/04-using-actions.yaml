name: 04- using actions

on: 
  push:
    paths-ignore:
        - '04-using-actions/**'
        

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v5
              with:
                submodules: true
            - name: printing folders
              run: ls
            - name: Setup python
              uses: actions/setup-python@v6
              with: 
                python-version: 3.14
            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r 04-using-actions/requirements.txt
            - name: Run python script
              run: python 04-using-actions/test.py



    