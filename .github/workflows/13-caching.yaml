name: 13-using caching

on:
    workflow_dispatch:
        inputs:
            use-cache:
                description: 'Use caching to speed up the build'
                type: boolean
                default: true

jobs:
    build:
        runs-on: ubuntu-latest

        steps:

            - name: Checkout code
              uses: actions/checkout@v5
            
            - name: Setup python with cache
              if: ${{inputs.use-cache == 'true'}}
              uses: actions/setup-python@v6
              with: 
                python-version: 3.14
                cache: 'pip'
                cache-dependency-path: 13-caching/requirements.txt

            - name: Setup python without cache
              if: ${{inputs.use-cache == 'false'}}
              uses: actions/setup-python@v6
              with: 
                python-version: 3.14

            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r 13-caching/requirements.txt

            

