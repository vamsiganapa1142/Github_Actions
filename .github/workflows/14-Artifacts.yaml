name: 14-Artifacts

on:
  workflow_dispatch:
    inputs:
        use-cache:
            description: 'Use caching to speed up the build'
            type: boolean
            default: true

jobs:

    build:
        runs-on: ubuntu-latest
        steps:

            - name: Checkout code
              uses: actions/checkout@v5
            
            - name: Setup python 
              uses: actions/setup-python@v6
              with: 
                python-version: 3.14

            - name: cache
              if: ${{inputs.use-cache}}
              uses: actions/cache@v3
              with:
                path: ~/.cache/pip
                key: ${{ runner.os }}-pip-${{ hashFiles('14-artifacts/requirments.txt') }}

            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r 14-artifacts/requirments.txt

            - name: Create artifact
              run: |
                echo "This is a sample artifact" > artifact.txt
                mkdir -p build
                cp 14-artifacts/requirments.txt build/

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                    name: my-artifact
                    path: build/
        


    deploy:

        runs-on: ubuntu-latest
        needs: build
        if: ${{ inputs.use-cache == 'true' }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Download artifact
              uses: actions/download-artifact@v4
              with:
                name: my-artifact


